<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Word House · 3D English Word Hunt - GachaLex</title>
<meta name="description" content="Explore a 3D word house with your pet: front yard, living room, kitchen, bathroom, bedroom, study, kids room and a farm. Tap objects to learn and hear words, play treasure hunt and listen-and-pick, and collect stars and room stickers.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#FFD66B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- inline:css/house.css -->
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="gl" aria-label="3D house. Drag to look around, click objects to learn English words."></canvas>
    <div id="labels"></div>
    <div id="fallback" hidden><p id="fbText">这个浏览器无法显示 3D，仍可用单词表和听音测验学习。</p></div>
  </div>

  <div class="hud" id="hudL">
    <p class="title">🏠 Word House <small id="hudEyebrow">学英语单词</small></p>
    <div class="stats">
      <span class="pill" id="starPill" title="Stars">⭐ <span id="starTxt">0</span></span>
      <span class="pill words" title="Words"><span>📖</span> <span id="progTxt">0 / 0</span></span>
      <span class="pill fire" id="firePill" hidden>🔥 <span id="fireTxt">1</span></span>
    </div>
    <div class="bar"><i id="progBar"></i></div>
    <nav class="scenes" aria-label="Scenes">
      <span class="scene on" aria-current="page"><span class="e">🏠</span><span data-k="house.scene.home">Home</span><small id="scSelfN"></small></span>
      <a class="scene" data-site="/school" href="https://www.logicobs.xyz/gachaLex/en/school"><span class="e">🏫</span><span data-k="house.scene.school">School</span><small id="scOtherN"></small></a>
    </nav>
  </div>

  <div class="hud" id="hudR">
    <a class="chip" id="homeLink" data-site="" href="https://www.logicobs.xyz/gachaLex/en"><span class="e">🏠</span><span class="t" data-k="nav.backToHome">Back to Home</span></a>
    <label class="chip whLangWrap"><select id="whLang" aria-label="Language">
      <option value="zh" data-k="lang.zh">Chinese</option>
      <option value="en" data-k="lang.en" selected>English</option>
      <option value="ja" data-k="lang.ja">Japanese</option>
      <option value="ko" data-k="lang.ko">Korean</option>
      <option value="th" data-k="lang.th">ไทย</option>
      <option value="hant" data-k="lang.hant">Traditional Chinese</option>
    </select></label>
    <button class="chip" id="listBtn" type="button"><span class="e">📖</span><span class="t" id="listBtnT">单词表</span></button>
    <button class="chip" id="stkBtn" type="button"><span class="e">🏅</span><span class="t" id="stkBtnT">贴纸册</span></button>
    <button class="chip go" id="goBtn" type="button"><span class="e">🚪</span><span class="t" id="goBtnT">进屋</span></button>
  </div>

  <div class="hud" id="pip">
    <div id="pipSvg" role="button" tabindex="0" aria-label="Pet"><img id="petImg" alt="" hidden><span id="petEmo" aria-hidden="true">🐣</span></div>
    <div id="bubble" aria-live="polite"><span id="bubbleTxt"></span><small id="bubbleSub"></small></div>
  </div>

  <div class="hud" id="fabs">
    <button class="fab hunt" id="huntBtn" type="button"><span class="e">🎯</span><span id="huntBtnT">寻宝游戏</span></button>
    <button class="fab quiz" id="quizBtn" type="button"><span class="e">🎧</span><span id="quizBtnT">听音选图</span></button>
  </div>

  <div class="hud" id="zonebar"></div>
  <div id="fade"></div>

  <div class="hud" id="huntBar" hidden aria-live="polite">
    <div class="row1"><span class="tag" id="huntTag">🎯 找一找</span><span class="dots" id="huntDots"></span><button class="x" id="huntX" type="button" aria-label="Close">&times;</button></div>
    <div class="target">
      <button class="spk" id="huntSay" type="button" aria-label="Listen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      <span id="huntEmo"></span>
      <div><p id="huntWord"></p><p id="huntZh"></p></div>
    </div>
    <div class="acts">
      <button class="chip" id="huntEar" type="button" aria-pressed="false">👂 <span id="huntEarT">只听声音</span></button>
      <button class="chip" id="huntSkip" type="button">⏭ <span id="huntSkipT">跳过</span></button>
    </div>
  </div>

  <div class="hud" id="sndTip" hidden><b id="sndTipTxt">没有声音？请检查手机侧边的静音开关和媒体音量，再点一次喇叭按钮。</b><button class="x" id="sndTipX" type="button" aria-label="Close">&times;</button></div>

  <aside class="side" id="card" hidden aria-live="polite">
    <div class="top"><p class="eyebrow" id="cZone"></p><button class="x" id="cClose" type="button" aria-label="Close">&times;</button></div>
    <div class="wordrow"><span class="bigemo" id="cEmo"></span><h2 class="word" id="cWord"></h2>
      <button class="spk" id="cSpeak" type="button" aria-label="Hear the word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button></div>
    <p class="ipa" id="cIpa"></p>
    <p class="zh" id="cZh"></p>
    <span class="newstar" id="cNew" hidden>+1 ⭐</span>
    <p class="def" id="cDef"></p>
    <div class="exbox"><p class="ex" id="cEx"></p><p class="exzh" id="cExZh"></p></div>
    <p class="tip" id="cTip"></p>
    <div class="acts">
      <button class="chip" id="cSent" type="button">🔊 <span id="cSentT">听句子</span></button>
      <button class="chip primary" id="cNext" type="button">➡️ <span id="cNextT">下一个</span></button>
    </div>
    <p class="note" id="cNote" hidden>这个浏览器不能朗读。</p>
  </aside>

  <aside class="side" id="drawer" hidden>
    <div class="top"><p class="eyebrow" id="dEyebrow">所有单词</p><button class="x" id="dClose" type="button" aria-label="Close">&times;</button></div>
    <ul class="list" id="listUl"></ul>
    <div class="vbox">
      <button class="chip" id="lblBtn" type="button" aria-pressed="true">🏷️ <span id="lblBtnT">标签</span></button>
    </div>
    <div class="vbox" id="voiceBox" hidden>
      <label id="voiceLabel" for="voiceSel">声音</label>
      <select id="voiceSel"></select>
      <button class="chip" id="voiceTest" type="button">🔊 <span id="voiceTestT">试听</span></button>
    </div>
    <div class="acts"><button class="chip" id="resetBtn" type="button">↺ <span id="resetBtnT">重新开始</span></button></div>
  </aside>

  <div class="modal" id="stk" hidden>
    <div class="mcard">
      <div class="top" style="display:flex;justify-content:space-between;align-items:center"><h2 id="stkTitle">🏅 我的贴纸册</h2><button class="x" id="stkX" type="button" aria-label="Close">&times;</button></div>
      <p id="stkHint" class="note" style="font-size:14px"></p>
      <div class="stickers" id="stkGrid"></div>
      <p style="margin:14px 0 0;text-align:center"><a class="chip" data-site="/school" href="https://www.logicobs.xyz/gachaLex/en/school"><span class="e">🏫</span><span class="t" data-k="house.scene.school">School</span><small id="stkOtherN" style="font:700 12px/1 var(--round);color:var(--muted)"></small></a></p>
    </div>
  </div>

  <div class="modal" id="quiz" hidden>
    <div class="mcard" id="quizCard">
      <div class="top" style="display:flex;justify-content:space-between;align-items:center"><h2 id="quizTitle">🎧 听音选图</h2><button class="x" id="quizX" type="button" aria-label="Close">&times;</button></div>
      <div id="quizBody"></div>
    </div>
  </div>

  <div class="modal" id="cele" hidden>
    <div class="mcard center" id="celeCard"></div>
  </div>

  <canvas id="confetti"></canvas>
</div>

<!-- inline:i18n -->
<!-- inline:boot.js -->
<!-- inline:house.js -->
</body>
</html>
